<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Día de los Carritos de Hot Wheels 🏎️❤️</title>
  <style>
    :root {
      --bg-color: #080914;
      --accent-red: #e63946;
      --accent-yellow: #ffb703;
      --card-bg: #111428;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* PANTALLA DE CARGA */
    #loader-screen {
      width: 100%;
    }

    .loader-title {
      font-size: 1.3rem;
      color: #8ecae6;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #1d2d44;
      border-radius: 20px;
      position: relative;
      margin-bottom: 15px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d62828, #f77f00, #fcbf49);
      border-radius: 20px;
      transition: width 0.1s linear;
    }

    .car-icon {
      position: absolute;
      top: -20px;
      left: 0%;
      font-size: 22px;
      transform: translateX(-50%);
      transition: left 0.1s linear;
    }

    .progress-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f1faee;
    }

    /* CONTENIDO PRINCIPAL */
    .main-title {
      font-size: 1.5rem;
      color: #90e0ef;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(144, 224, 239, 0.4);
    }

    /* FLORES DE SUEÑO / RAMO */
    .bouquet {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 25px;
      font-size: 2.5rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* TARJETA HOT WHEELS INTERACTIVA */
    .card-wrapper {
      width: 280px;
      height: 400px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      border: 4px solid #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* FRENTE */
    .card-front {
      background: linear-gradient(135deg, #d62828, #003049);
    }

    .logo-hw {
      background: #d62828;
      color: #fcbf49;
      font-style: italic;
      font-weight: 900;
      font-size: 1.4rem;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .car-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .tap-hint {
      font-size: 0.85rem;
      color: #f1faee;
      opacity: 0.8;
    }

    /* REVERSO (MENSAJE) */
    .card-back {
      background: linear-gradient(135deg, #111428, #1d2d44);
      transform: rotateY(180deg);
      justify-content: center;
    }

    .message-text {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #f1faee;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA DE CARGA -->
    <div id="loader-screen">
      <h2 class="loader-title">Cargando tu ramo de Hot Wheels...</h2>
      <div class="progress-track">
        <div id="car" class="car-icon">🏎️</div>
        <div id="progress-bar" class="progress-fill"></div>
      </div>
      <div id="progress-text" class="progress-text">0%</div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" class="hidden">
      <h1 class="main-title">Feliz Día de los Carritos de Hot Wheels ❤️</h1>
      
      <div class="bouquet">
        <span>💙</span><span>🌸</span><span>💙</span><span>🌸</span><span>💙</span>
      </div>

      <!-- TARJETA INTERACTIVA -->
      <div id="card" class="card-wrapper">
        <div class="card-inner">
          <div class="card-front">
            <div class="logo-hw">HOT WHEELS</div>
            <img id="car-image" class="car-img" src="https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?w=600" alt="Hot Wheels Car" />
            <span class="tap-hint">Toca la tarjeta 🔄</span>
          </div>
          <div class="card-back">
            <p id="card-message" class="message-text">Haces que cada día sea mejor que el anterior.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let progress = 0;
      const progressBar = document.getElementById("progress-bar");
      const car = document.getElementById("car");
      const progressText = document.getElementById("progress-text");
      const loaderScreen = document.getElementById("loader-screen");
      const mainContent = document.getElementById("main-content");
      const card = document.getElementById("card");
      const cardMessage = document.getElementById("card-message");

      // Lista de mensajes que irán cambiando con cada clic
      const messages = [
        "Haces que cada día sea mejor que el anterior. ❤️",
        "Cuanto más tiempo estoy contigo, más te amo. ✨",
        "Aceleraste mi corazón desde el primer día. 🏎️💨",
        "Eres mi lugar favorito para descansar y estar en calma. 🌹"
      ];
      let messageIndex = 0;

      // Animación de la barra de carga
      const interval = setInterval(() => {
        progress += 1;
        progressBar.style.width = progress + "%";
        car.style.left = progress + "%";
        progressText.innerText = progress + "%";

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            loaderScreen.classList.add("hidden");
            mainContent.classList.remove("hidden");
          }, 400);
        }
      }, 35);

      // Rotación y cambio de mensajes al tocar la tarjeta
      card.addEventListener("click", () => {
        card.classList.toggle("flipped");

        if (card.classList.contains("flipped")) {
          cardMessage.innerText = messages[messageIndex];
          messageIndex = (messageIndex + 1) % messages.length;
        }
      });
    });
  </script>

</body>
</html>
